name: Validación del proyecto

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos principales
        run: |
          test -f README.md
          test -f index.html
          echo "Validación completada correctamente"